name: Rename site file to index.html
on:
  push:
    paths:
      - '.github/workflows/rename-to-index.yml'
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename site file to index.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f sathish-a-chettarki.html ]; then
            git mv sathish-a-chettarki.html index.html
            rm -f .github/workflows/rename-to-index.yml
            git add -A
            git commit -m "Rename sathish-a-chettarki.html to index.html"
            git push
          fi
